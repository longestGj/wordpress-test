name: ${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME}
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:7.1.1-php8.3-apache
    ports:
      - "127.0.0.1:${WP_PORT:?Set WP_PORT}:80"
    environment: &wp-environment
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('SITE_STARTER_LOCAL', true);
        define('DISALLOW_FILE_EDIT', true);
    volumes: &wp-volumes
      - wordpress:/var/www/html
      - ./wp-content/themes/site-starter:/var/www/html/wp-content/themes/site-starter:ro
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./scripts:/workspace/scripts:ro
      - ./tests:/workspace/tests:ro
      - ./backups:/workspace/backups
    depends_on:
      db:
        condition: service_healthy
  cli:
    image: wordpress:cli-2.12.0-php8.3
    entrypoint: ["wp"]
    profiles: [tools]
    user: "33:33"
    environment:
      <<: *wp-environment
      WP_ADMIN_USER: ${WP_ADMIN_USER:?Set WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?Set WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?Set WP_ADMIN_EMAIL}
      WP_SITE_TITLE: ${WP_SITE_TITLE:?Set WP_SITE_TITLE}
      WP_PORT: ${WP_PORT:?Set WP_PORT}
    volumes: *wp-volumes
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  wordpress:
