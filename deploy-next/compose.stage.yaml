name: ${COMPOSE_PROJECT_NAME:-tio2products-next-stage}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: ${APP_IMAGE:-tio2products-next:stage}
    build:
      context: ..
      dockerfile: deploy-next/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'staging');
        define('WP_HOME', getenv('PUBLIC_URL'));
        define('WP_SITEURL', getenv('PUBLIC_URL'));
        define('DISALLOW_FILE_EDIT', true);
        define('DISALLOW_FILE_MODS', true);
        define('WP_AUTO_UPDATE_CORE', false);
    ports:
      - "127.0.0.1:${STAGE_PORT:-18080}:80"
    volumes:
      - uploads:/var/www/html/wp-content/uploads
    networks:
      - backend
      - edge
    healthcheck:
      test: [CMD-SHELL, "php -r '$$s=@fsockopen(\"127.0.0.1\",80); if(!$$s)exit(1); fclose($$s);'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

networks:
  backend:
    internal: true
  edge:

volumes:
  database:
    name: ${VOLUME_PREFIX:-tio2products_next}_db
  uploads:
    name: ${VOLUME_PREFIX:-tio2products_next}_uploads
