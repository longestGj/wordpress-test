# Generated by scripts/build-legacy-domain-redirect.py.
# Apply only on the legacy Nginx host after verifying both public sitemaps.
# Unmatched paths retain the old upstream for separate mapping review.
map_hash_bucket_size 128;
map $uri $tio2_has_new_equivalent {
    default 0;
    / 1;
    /about/ 1;
    /markets/ 1;
    /markets/european-union/ 1;
    /markets/germany/ 1;
    /markets/italy/ 1;
    /markets/spain/ 1;
    /markets/poland/ 1;
    /markets/netherlands/ 1;
    /markets/belgium/ 1;
    /markets/united-kingdom/ 1;
    /markets/india/ 1;
    /markets/brazil/ 1;
    /pt-br/markets/brazil/ 1;
    /products/ 1;
    /products/chloride-process-titanium-dioxide/ 1;
    /products/sulfate-process-titanium-dioxide/ 1;
    /products/m-350/ 1;
    /products/m-510/ 1;
    /products/m-896/ 1;
    /products/m-996/ 1;
    /products/m-2196/ 1;
    /products/m-895/ 1;
    /products/m-200/ 1;
    /products/m-108/ 1;
    /products/m-210/ 1;
    /products/m-340/ 1;
    /products/m-886/ 1;
    /products/m-52/ 1;
    /products/m-2377/ 1;
    /products/cr-901/ 1;
    /applications/ 1;
    /applications/titanium-dioxide-for-coatings/ 1;
    /applications/titanium-dioxide-for-plastics/ 1;
    /applications/titanium-dioxide-for-masterbatch/ 1;
    /applications/titanium-dioxide-for-printing-inks/ 1;
    /applications/titanium-dioxide-for-paper/ 1;
    /documents/ 1;
    /documents/reach/ 1;
    /documents/tds-sds-coa/ 1;
    /documents/certificate-of-origin/ 1;
    /request-documents/ 1;
    /resources/ 1;
    /resources/non-china-titanium-dioxide/ 1;
    /resources/chloride-vs-sulfate-titanium-dioxide/ 1;
    /resources/chemours-titanium-dioxide-alternatives/ 1;
    /resources/ti-pure-r-706-alternative/ 1;
    /resources/eu-titanium-dioxide-anti-dumping-duty/ 1;
    /resources/uk-titanium-dioxide-anti-dumping-investigation/ 1;
    /resources/india-titanium-dioxide-anti-dumping-duty/ 1;
    /resources/brazil-titanium-dioxide-anti-dumping-duty/ 1;
    /request-a-quote/ 1;
    /request-sample/ 1;
    /contact/ 1;
    /privacy-policy/ 1;
    /ms/privacy-policy/ 1;
    /cookie-policy/ 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name tio2malaysia.com www.tio2malaysia.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/tio2-acme; }
    location = /sitemap.xml { return 301 https://tio2products.com/wp-sitemap.xml; }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://tio2products.com/wp-sitemap.xml\n";
    }
    location / {
        if ($tio2_has_new_equivalent) { return 301 https://tio2products.com$request_uri; }
        return 301 https://tio2malaysia.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tio2malaysia.com www.tio2malaysia.com;
    ssl_certificate /etc/letsencrypt/live/tio2malaysia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tio2malaysia.com/privkey.pem;
    if ($tio2_has_new_equivalent) { return 301 https://tio2products.com$request_uri; }
    if ($host = www.tio2malaysia.com) { return 301 https://tio2malaysia.com$request_uri; }
    location = /sitemap.xml { return 301 https://tio2products.com/wp-sitemap.xml; }
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://tio2products.com/wp-sitemap.xml\n";
    }
    location / {
        # Preserve the old upstream for paths without a verified replacement.
        if (-f /etc/tio2-production/cms-maintenance.json) { return 503; }
        include /etc/tio2-production/web-upstream.conf;
        proxy_set_header Host tio2malaysia.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name tio2malaysia.com www.tio2malaysia.com;
    location / { include /etc/tio2-production/web-upstream.conf; proxy_set_header Host tio2malaysia.com; }
}
